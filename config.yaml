model_list:
  - model_name: fast
    litellm_params:
      model: novita/meta-llama/llama-3.1-8b-instruct
      litellm_credential_name: novita

  - model_name: smart
    litellm_params:
      model: novita/deepseek/deepseek-v3-0324
      litellm_credential_name: novita

  - model_name: reasoning
    litellm_params:
      model: novita/deepseek/deepseek-r1-turbo
      litellm_credential_name: novita

credential_list:
  - credential_name: novita
    credential_values:
      api_key: os.environ/NOVITA_API_KEY
    credential_info:
      description: Novita AI gateway credentials
      custom_llm_provider: novita

litellm_settings:
  cache: true
  cache_params:
    type: redis
    url: os.environ/REDIS_URL
  drop_params: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  database_connection_pool_limit: 10
